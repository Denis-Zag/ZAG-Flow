# Входящий X-Real-IP перезаписывается внешним Nginx; прямых публичных портов нет.
limit_req_zone $http_x_real_ip zone=admin_login:1m rate=6r/m;
limit_req_zone $http_x_real_ip zone=visitor_metrics:1m rate=4r/s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 32k;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location = /api/auth/login {
        limit_req zone=admin_login burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/conf.d/api-proxy.inc;
    }

    location = /api/auth/register {
        limit_req zone=admin_login burst=3 nodelay;
        limit_req_status 429;
        include /etc/nginx/conf.d/api-proxy.inc;
    }

    location = /api/behavior-metrics {
        limit_req zone=visitor_metrics burst=8 nodelay;
        limit_req_status 429;
        include /etc/nginx/conf.d/api-proxy.inc;
    }

    location /api/ {
        include /etc/nginx/conf.d/api-proxy.inc;
    }

    location /v2/ { return 404; }

    location / {
        add_header Cache-Control no-cache;
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:css|js|svg)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }
}
